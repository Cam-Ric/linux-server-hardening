
# Linux Server Hardening - Password Quality Policy
# Configuration for pam_pwquality.

# Minimum password length
minlen = 12

# Minimum 2 digits
dcredit = -2

# Minimum 2 uppercase characters
ucredit = -2

# Minimum 2 special characters
ocredit = -2

# Require all 4 character classes
minclass = 4

# Maximum consecutive repeated characters
maxrepeat = 3

# Maximum consecutive characters from the same class
maxclassrepeat = 20

# Enable dictionary and username checks
dictcheck = 1
usercheck = 1
usersubstr = 1

# Custom multilingual CrackLib dictionary
dictpath = /usr/local/share/blackbox-dictionaries/es-en-va

# Maximum password entry attempts
retry = 20

# Apply password quality enforcement to root
enforce_for_root
